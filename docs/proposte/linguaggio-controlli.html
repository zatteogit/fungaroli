<!doctype html><html lang="it" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fronda · Un linguaggio per i controlli · Proposta</title><link rel="stylesheet" href="../../css/fonts.css"><link rel="stylesheet" href="../../css/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font-body)}.board{max-width:1200px;margin:auto;padding:32px 24px}.board h1{font:600 36px/1.1 var(--font-display);margin:8px 0 14px}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.lead{max-width:70ch;color:var(--text-2)}.palette{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.swatch{min-width:140px;padding:14px 18px;border-radius:12px;color:var(--story-ink);font-weight:600}.themes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}iframe{width:100%;height:830px;border:1px solid var(--border);border-radius:18px}.theme{padding:24px}.theme h1{font:600 27px/1.2 var(--font-display);margin:0 0 6px}.hint{margin:0 0 24px;color:var(--muted);font-size:13px}.sample{padding:20px 0;border-top:1px solid var(--hair)}.sample h2{font:600 14px/1.4 var(--font-body);margin:0 0 12px}.sample p{color:var(--muted);font-size:12px;margin:10px 0 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,a{font:600 14px/1.4 var(--font-body)}button{cursor:pointer}.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid transparent;text-decoration:none}.action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.primary{background:var(--action);color:var(--action-ink);border-color:var(--action)}.primary:hover{background:var(--action-hover)}.secondary{background:transparent;color:var(--text);border-color:var(--control-edge)}.secondary:hover{background:var(--surface-2)}.chip{min-height:40px;border:1px solid var(--control-edge);border-radius:999px;padding:8px 13px;background:transparent;color:var(--text)}.chip[aria-pressed=true]{background:var(--select);color:var(--select-ink);border-color:var(--select-edge);box-shadow:inset 0 0 0 1px var(--select-edge)}.chip .check{display:none;margin-right:5px}.chip[aria-pressed=true] .check{display:inline}.tabs{display:flex;gap:0;border-bottom:1px solid var(--hair)}.tabs button{min-height:44px;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted)}.tabs button[aria-selected=true]{border-bottom-color:var(--select-edge);color:var(--select-ink);background:var(--select)}.text-link{display:inline-block;color:var(--link);text-decoration:underline;text-underline-offset:4px;padding:6px 0}button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.live{min-height:22px;margin-top:8px;font-size:12px;color:var(--muted)}.context{margin-top:10px;border:1px solid var(--hair);padding:16px;border-radius:16px}.context strong{display:block;margin-bottom:12px}.foot{font-size:12px;color:var(--muted);margin-top:18px}.badge{display:inline-block;background:var(--surface-2);padding:4px 9px;border-radius:6px}@media(max-width:800px){.themes{grid-template-columns:1fr}.board{padding:24px 16px}.board h1{font-size:30px}}@media(max-width:400px){.theme{padding:18px}.action{padding-inline:12px}.tabs button{padding-inline:10px}}
</style><body><div id="app"></div><script>
const query=new URLSearchParams(location.search),embed=query.has('theme'),theme=query.get('theme');
const feather='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5C17 1 12 3 9 6.5C6 10 5 14 5.5 18.5L10 18C13.5 16.5 16.5 13 18.5 9.5C20 7 20.5 5 20.5 3.5ZM3 22 16.5 7.5M7.5 16.5H12M10.5 13H15"/></svg>';
const search='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M6 11c0-5 8-5 8 0ZM9 11v3h2v-3"/></svg>';
const compare='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg>';
if(!embed){document.querySelector('#app').innerHTML=`<main class="board"><span class="eyebrow">Fronda · Direzione approvata per la prova</span><h1>Un colore, un ruolo.<br>Una forma, un comportamento.</h1><p class="lead">Verde e forma tonda per agire; bianco per la stessa azione in dark. Giallo per ciò che è selezionato, mantenendo le geometrie e i bordi precedenti. Ciclamino e corallo danno ritmo ai contenuti.</p><div class="palette" aria-label="Accenti editoriali"><div class="swatch" style="background:var(--story-polline)">Polline</div><div class="swatch" style="background:var(--story-ciclamino)">Ciclamino</div><div class="swatch" style="background:var(--story-corallo)">Corallo</div></div><div class="themes"><iframe title="Proposta tema chiaro" src="?theme=light"></iframe><iframe title="Proposta tema scuro" src="?theme=dark"></iframe></div><p class="foot">Tavola locale della direzione approvata: pulsanti, filtri e tab sono dimostrativi. Nessun dato viene salvato. «Annota» è prioritario nel punto in cui si registra; «Confronta» può diventare primario quando è il passo principale del confronto.</p></main>`}
else{document.documentElement.dataset.theme=theme;document.querySelector('#app').innerHTML=`<main class="theme"><h1>${theme==='dark'?'Bosco notte':'Carta e bosco'}</h1><p class="hint">Stessi ruoli e stesse forme, cambiano i contrasti.</p><section class="sample"><h2>1 · Azione principale</h2><div class="row"><button class="action primary" data-demo="Annota">${feather}Annota</button><button class="action secondary" data-demo="Confronta">${compare}Confronta</button></div><p>Un solo invito dominante per gruppo di azioni.</p></section><section class="sample"><h2>2 · Accessi a due strumenti equivalenti</h2><div class="row"><button class="action secondary" data-demo="Impara a riconoscere">${search}Impara a riconoscere</button><button class="action secondary" data-demo="Confronta">${compare}Confronta</button></div><p>Stesso rilievo: entrambi hanno icona, etichetta e contorno.</p></section><section class="sample"><h2>3 · Selezione: qualcosa che rimane scelto</h2><div class="row"><button class="chip" aria-pressed="true"><span class="check" aria-hidden="true">✓</span>Funghi</button><button class="chip" aria-pressed="false"><span class="check" aria-hidden="true">✓</span>Piante</button><button class="chip" aria-pressed="false"><span class="check" aria-hidden="true">✓</span>Sentieri</button></div><p>Il giallo, il bordo e la spunta indicano lo stato. Prova a cambiare.</p></section><section class="sample"><h2>4 · Navigazione: dove ti trovi</h2><div class="tabs" role="tablist" aria-label="Categorie di esempio"><button role="tab" aria-selected="true">Funghi</button><button role="tab" aria-selected="false">Piante</button><button role="tab" aria-selected="false">Alberi</button></div><p>Indicatore persistente nel gruppo, senza sembrare un pulsante da confermare.</p></section><section class="sample"><h2>5 · Approfondimento</h2><a class="text-link" href="#dettagli" data-demo="Approfondimento">Dimmi di più</a><p>Un link esplicito; nessun fondo giallo.</p></section><div class="live" aria-live="polite">Gli esempi sono interattivi, senza salvataggi.</div></main>`;
document.addEventListener('click',e=>{const chip=e.target.closest('.chip');if(chip)chip.setAttribute('aria-pressed',chip.getAttribute('aria-pressed')!=='true');const tab=e.target.closest('[role=tab]');if(tab){tab.parentElement.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected',t===tab));}const demo=e.target.closest('[data-demo]');if(demo){e.preventDefault();document.querySelector('.live').textContent='Esempio: si apre «'+demo.dataset.demo+'». Nessun dato salvato.'}});}
</script></body></html>
