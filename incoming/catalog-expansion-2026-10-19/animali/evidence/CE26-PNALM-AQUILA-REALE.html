PNALM/Bamby-CETS-300.gif" alt="Hotel Bamby" /></a></div></div></div><div id="main_colonna_dx"><div id="cnt_main_colonna_dx"><div id="sharefooter"><span>Condividi</span><a target="_blank" title="Condividi su Facebook" href="http://www.facebook.com/sharer.php?u=https://www.parcoabruzzo.it/fauna.schede.dettaglio.php?id=253"><img alt="Facebook" src="grafix/x.gif" class="fb"></a><a target="_blank" title="Condividi su LinkedIn" href="https://www.linkedin.com/cws/share?url=https://www.parcoabruzzo.it/fauna.schede.dettaglio.php?id=253%20Aquila%20reale%20%7c%20Parco%20Nazionale%20d'Abruzzo,%20Lazio%20e%20Molise"><img alt="LinkedIn" src="grafix/x.gif" class="linkedin"></a><a target="_blank" title="Condividi per e-mail" href="mailto:?subject=Aquila%20reale%20%7c%20Parco%20Nazionale%20d'Abruzzo,%20Lazio%20e%20Molise&amp;body=Ti%20segnalo%20questa%20pagina:%20https://www.parcoabruzzo.it/fauna.schede.dettaglio.php?id=253"><img alt="email" src="grafix/x.gif" class="mail"></a><a target="_blank" title="Condividi su WhatsApp" href="whatsapp://send?text=https://www.parcoabruzzo.it/fauna.schede.dettaglio.php?id=253"><img alt="whatsapp" src="grafix/x.gif" class="whatsapp"></a></div><h5><a href="index.php">Home</a>  &raquo;  <a href="pagina.php?id=332">Natura</a>  &raquo;  <a href="pagina.php?id=46">Fauna</a>  &raquo;  <a href="fauna.schede.php">Schede</a></h5><h1><a id="top"></a>Aquila reale</h1><h3>Aquila chrysaetos</h3><div id="colonna_testo"><strong>Classe: </strong>Uccelli (Aves) <br/><br/><strong>Ordine: </strong>Accipitriformes (Accipitriformes) <br/><br/><strong>Famiglia: </strong>Accipitridi (Accipitridae) <br/><br/>E' il rapace per&nbsp;antonomasia&nbsp;chiamata molto spesso semplicement aquila&nbsp;presente in Europa, Asia Nordamerica e Nordafrica.<br/><br/><strong>Dimensioni: </strong>dai 70cm ai 120cm compreso la coda. Il peso varia dai 3 ai 7 kg. La femmina è più grande.<br/><br/><strong>Habitat: </strong>Sulle creste di montagna pi&ugrave; alte ed inaccessibili.<br/><br/><strong>Cosa mangia: </strong>Piccoli mammiferi o uccelli, ma anche giovani camosci pi&ugrave; deboli.<br />Integra regolarmente la sua dieta con resti di animali rinvenuti morti come ungulati vittime dei rigori invernali.&nbsp;<br/><br/><strong>Riproduzione: </strong>L'accoppiamento&nbsp;avviene in&nbsp;marzo&nbsp;e viene preceduto da uno spettacolare rituale noto come danza del&nbsp;cielo, che per vari giorni&nbsp;vede impegnati entrambi gli individui in spettacolari evoluzioni aeree che spesso la femmina compie in volo rovesciato mentre il maschio sembra piombarle sopra, con scambi di preda in volo o giri della morte.<br />Fedeli per tutta la vita&nbsp;l'accoppiamento avviene sempre a terra.<br />La deposizione delle&nbsp;uova (solitamente&nbsp;due) avviene a distanza di 2 - 5 giorni l'una dall'altra. <br />Le uova si schiudono dopo circa 45 giorni di cova.<br/><br/><strong>Piccoli: </strong>Dopo due mesi i pulcini diventano aquilotti ed iniziano ad esercitarsi nel volo sul bordo del nido. <br />Spiccano il primo volo dopo 2 mesi circa e a 6 mesi diventano indipendenti.<br />In questo periodo vengono portati dai genitori fuori dai confini del territorio natale e verso i 3 - 6 anni costituiranno un nuovo nucleo familiare.<br/><br/><strong>Curiosità: </strong>Anche se le leggende parlano di agnelli, volpi (ed in passato addirittura di bambini) sollevati dall'aquila, in realt&agrave; pu&ograve; trasportare al nido prede di medie dimensioni (ca. kg 1,5) solo se la cattura &egrave; avvenuta in posizione sopraelevata rispetto al nido.<br/><br/><strong>Nel Parco: </strong>Presente con due o tre coppie e di facile avvistamento mentre sorvola creste, valli e vette alla ricerca di prede.<br/><br/></div><div id="colonna_foto"><a title="Aquila reale" data-lightbox="lightbox[slide]" href="/fotoGallery/19992_4_PNALM.jpeg"><img src="/fotoGallery/19992_4_PNALM.jpeg" alt="Aquila reale" /></a><div class="dida">Aquila reale<small><br/><em>(foto di: Angela Iannarelli)</em></small></div><div class="separafoto">&nbsp;</div></div></div></div></div><div id="menuapertofooter"><div id="corpomenuapertofooter"><div class="men first"><div class="tit"><a href="pagina.php?id=332">Natura</a></div><div><a href="pagina.php?id=510">Orsi, lupi, camosci, cervi, caprioli e aquile</a></div><div><a href="pagina.php?id=44">Il Territorio</a></div><div><a href="pagina.php?id=46">Fauna</a></div><div><a href="pagina.php?id=47">Flora</a></div><div><a href="pagina.php?id=536">Specie in direttiva</a></div><div><a href="specie-direttiva-habitat.php">Habitat in direttiva </a></div><div><a href="pagina.php?id=429">Area Ramsar - Lago di Barrea</a></div><div><a href="pagina.php?id=520">Riserve statali Feudo Intramonti e Colle Di Licco</a></div><div><a href="pagina.php?id=533">Aree importanti per l'avifauna (IBA)</a></div><div><a href="pagina.php?id=506">Patrimonio UNESCO</a></div><div><a href="pagina.php?id=531">Monitoraggi</a></div><div><a href="pagina.php?id=511">La strategia nazionale per la biodiversità</a></div><div><a href="pagina.php?id=540">Parco e Rete Natura 2000</a></div><div><a href="pagina.php?id=532">Zona di protezione esterna (ZPE)</a></div><div><a href="pagina.php?id=428">Diploma Europeo</a></div><div><a href="https://sit.parcoabruzzo.it/portal/home/">Portale Cartografico</a></div></div><div class="men"><div class="tit"><a href="pagina.php?id=148">Orso marsicano</a></div><div><a href="news-orsomarsicano.php">News</a></div><div><a href="notizia-vera-falsa.php">Notizia vera o falsa?</a></div><div><a href="scheda-orso.php">Orso marsicano in breve</a></div><div><a href="pagina.php?id=95">Conoscere l'orso marsicano</a></div><div><a href="faq_orso.php">FAQ sull'orso</a></div><div><a href="pagina.php?id=544">Norme di comportamento</a></div><div><a href="pagina.php?id=553">I nostri orsi</a></div><div><a href="pagina.php?id=641">Orsi noti</a></div><div><a href="pagina.php?id=461">PATOM</a></div><div><a href="pagina.php?id=451">Monitoraggio	</a></div><div><a href="pagin
