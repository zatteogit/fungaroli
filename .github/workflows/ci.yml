name: CI

on:
  pull_request:
  push:
    branches: [claude/brave-tesla-wu0a2b]
  workflow_dispatch:
    inputs:
      browser:
        description: Verifica completa browser prima del rilascio
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Studio Fronda — token, risorse e contratti
        run: node docs/fronda/scripts/check.mjs
      - name: Studio Fronda — regressioni del guard
        run: node docs/fronda/scripts/guard-test.mjs
      - name: Configurazione del Worker
        run: npx wrangler deploy --dry-run
      - name: Spazi e conflitti nel diff
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.sha }}

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    name: browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tutta la suite sul Worker locale
        run: CHROMIUM_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")" npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 5
