name: CI

on:
  pull_request:
  push:
    branches: [claude/brave-tesla-wu0a2b]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configurazione del Worker
        run: npx wrangler deploy --dry-run
      - name: Spazi e conflitti nel diff
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.sha }}
